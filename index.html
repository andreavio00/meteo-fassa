<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4a6670">
<title>Meteo Val di Fassa</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="stations-ui.css">
<link rel="stylesheet" href="forecast-ui.css">
</head>
<body>
<main class="page">
<header class="page-header">
<div class="eyebrow">🏔️ Val di Fassa</div>
<h1><span class="title-icon">🏔️</span>Pozza live</h1>
<div id="worker-status" class="worker-status">Aggiornamento dati…</div>
</header>

<section aria-label="Stazioni di riferimento">
<div class="reference-grid">
<div id="hero-station"></div>
<div id="pozza-amateur"></div>
</div>
</section>

<section aria-label="Stazioni di confronto">
<div id="compact-stations" class="compact-grid"></div>
</section>

<section class="forecast-section">
<details id="forecast-details" class="forecast-details">
<summary class="forecast-summary">
<span class="forecast-summary-main">
<span class="forecast-icon" aria-hidden="true">🌦️</span>
<span class="forecast-heading">
<strong>Previsioni</strong>
<small id="forecast-preview">Caricamento della prossima fascia…</small>
</span>
</span>
<span class="summary-arrow">▼</span>
</summary>
<div class="forecast-content">
<div id="forecast-status" class="worker-status" hidden></div>
<div id="forecast-tabs" class="forecast-tabs" role="tablist" aria-label="Giorni di previsione"></div>
<div id="forecast-day-summary" class="forecast-day-summary"></div>
<div id="forecast-grid" class="forecast-grid"></div>
<div class="forecast-attribution">Dati previsionali: meteo.report / GeoSphere Austria · aggiornamento automatico</div>
</div>
</details>
</section>

<section class="trip-section">
<details id="trip-details">
<summary>
<span><strong>🥾 Per un’escursione</strong><small>Situazione in quota e previsioni</small></span>
<span class="summary-arrow">▼</span>
</summary>
<div class="trip-content">
<div class="trip-zones" role="tablist" aria-label="Zone escursioni">
<button class="trip-zone active" data-zone="catinaccio" type="button">Catinaccio</button>
<button class="trip-zone" data-zone="sella" type="button">Gruppo del Sella e Sassolungo</button>
<button class="trip-zone" data-zone="marmolada" type="button">Marmolada e Val San Nicolò</button>
<button class="trip-zone" data-zone="moena" type="button">Moena e Latemar</button>
</div>
<div id="trip-status" class="worker-status">Tocca per caricare i dati…</div>
<div id="trip-grid" class="trip-grid"></div>
<div id="trip-forecast-preview" class="trip-forecast-preview"></div>
<a id="trip-page-link" class="trip-page-link" href="escursioni.html?zona=catinaccio">Apri la pagina completa →</a>
</div>
</details>
</section>
</main>

<div id="modal-backdrop" class="modal-backdrop" hidden>
<div class="modal-sheet" role="dialog" aria-modal="true">
<button id="modal-close" class="modal-close" aria-label="Chiudi">✕</button>
<div id="modal-body"></div>
</div>
</div>

<script src="trip-config.js"></script>
<script src="stations-ui.js"></script>
<script src="app.js"></script>
<script src="forecast-ui.js"></script>
</body>
</html>

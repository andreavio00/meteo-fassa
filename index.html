<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4a6670">
<title>Meteo Val di Fassa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
<header class="page-header">
<div class="eyebrow">🏔️ Val di Fassa</div>
<h1><span class="title-icon">🏔️</span>Pozza live</h1>
<div id="worker-status" class="worker-status">Aggiornamento dati…</div>
</header>

<section aria-label="Stazione di riferimento">
<div id="hero-station"></div>
</section>

<section aria-label="Stazioni di confronto">
<div id="compact-stations" class="compact-grid"></div>
</section>

<section class="forecast-section">
<div class="forecast-card">
<div class="forecast-top">
<span class="forecast-icon">⏱️</span>
<div class="forecast-heading">
<strong>Previsioni</strong>
<small>Prossime ore e fascia della giornata</small>
</div>
<span class="coming-soon">Coming soon</span>
</div>
<div class="forecast-link-row">
<span class="forecast-link disabled">📅 Previsioni della settimana ↗ <em>in arrivo</em></span>
</div>
</div>
</section>

<section class="trip-section">
<details id="trip-details">
<summary>
<span><strong>🌦️ Meteo per una gita</strong><small>Stazioni in quota della valle</small></span>
<span class="summary-arrow">▼</span>
</summary>
<div class="trip-content">
<div id="trip-status" class="worker-status">Tocca per caricare i dati…</div>
<div id="trip-grid" class="trip-grid"></div>
</div>
</details>
</section>
</main>

<div id="trip-modal-backdrop" class="modal-backdrop" hidden>
<div class="modal-sheet" role="dialog" aria-modal="true">
<button id="trip-modal-close" class="modal-close" aria-label="Chiudi">✕</button>
<div id="trip-modal-body"></div>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
